# playback_history.lua 配置
# 这些项也能在 mpv 里改：播放历史菜单按 .. 到最外层 → 设置，点行内 < > 换档（改完自动写回本文件）
# 播放中每隔多少秒把进度写盘（另有暂停时/退出时即时落盘）
save_interval=1800
# 记录进度少于这个秒数就不自动续播
min_resume=30
# 历史上限，超出淘汰最旧的
max_items=500

# 新建历史条目所需的最小播放秒数（只被加载、没真播的不入历史）
min_play=3
# 历史文件路径，留空则用 portable_config/playback_history.json
file=

# 空启动时：若最近一条是网络流（FnTV），空格/回车/点击改用最近一条本地记录
# （yes=开启，默认；no=依然播最近一条，哪怕它是网络流）
idle_prefer_local=yes
# 网络记录是否可点播：auto=自动判断（疑似临时地址则置灰）| always=全可点 | never=全置灰
stream_play=auto
# 网络来源别名：host=名字，逗号分隔（如 192.168.1.9=飞牛NAS, plex.local=Plex）
# host 即流地址里的域名/IP；未命中的用常见后端指纹（Plex/Jellyfin/Emby）或域名本身。
# 飞牛影视的本地中继（127.0.0.1:<端口>/api/v1/playvideo/<itemGuid>?session=…）自动归到
# 「飞牛影视」并按 itemGuid 去重；想改名写 fntv=新名字
source_names=
# 点历史里的本地文件时是否带出同目录剧集（复刻「打开文件夹」的列表续播）
# filter=按文件名相似度（默认，推荐）| same=同目录全部可播放文件 | no=只播这一个文件
list_expand=filter
